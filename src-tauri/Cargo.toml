[package]
name = "hane-flight"
version = "0.1.0"
description = "HANE Flight 的桌面版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# the window only shows the page, so a small exe matters more than Rust speed
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
